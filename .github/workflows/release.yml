name: Release

# Publishes the artifacts of a release: Windows installer + portable zip, Linux
# Flatpak bundle. Triggered by a "vX.Y.Z" tag; a manual run produces the same
# artifacts without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a construire (x.y.z)'
        required: true
        default: '0.0.0'

permissions:
  contents: write

env:
  # The Flatpak takes Qt from the KDE 6.11 runtime; only Windows installs Qt.
  # aqtinstall 3.3.0 cannot install Qt 6.11 on Windows: the Qt repository changed
  # its layout for 6.11 (one subfolder per architecture,
  # qt6_6112/qt6_6112_mingw/) while aqt still looks for qt6_6112/qt6_6112/.
  # 6.10.3 is the latest installable version and still meets the project floor
  # (qt_standard_project_setup REQUIRES 6.10). Move back to 6.11 once aqtinstall
  # handles the new tree.
  QT_VERSION_WINDOWS: 6.10.3
  APP_ID: io.github.fyutins.OTTix

jobs:
  version:
    name: Determine the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get.outputs.version }}
    steps:
      - id: get
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Strict x.y.z: CMake (project(VERSION)) and Inno Setup
          # (VersionInfoVersion) reject any non-numeric suffix.
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version: '$version' (expected x.y.z)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Add MinGW and Ninja
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          choco install ninja -y --no-progress

      - name: Download libmpv
        shell: pwsh
        run: |
          & .github/scripts/fetch-libmpv.ps1 -Destination "$env:GITHUB_WORKSPACE\mpv"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DOTTIX_VERSION="${{ needs.version.outputs.version }}" `
            -DMPV_INCLUDE_DIR="$env:GITHUB_WORKSPACE/mpv/include" `
            -DMPV_LIBRARY="$env:GITHUB_WORKSPACE/mpv/libmpv.dll.a" `
            -DMPV_RUNTIME_DLL="$env:GITHUB_WORKSPACE/mpv/libmpv-2.dll"

      - name: Build
        run: cmake --build build

      # Produces dist\: exe + Qt DLLs (windeployqt) + qml\ + libmpv-2.dll.
      - name: Deploy
        run: cmake --install build --prefix dist

      - name: Archive portable
        shell: pwsh
        run: |
          $name = "OTTix-${{ needs.version.outputs.version }}-win64.zip"
          Compress-Archive -Path dist\* -DestinationPath $name

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc /DAppVersion="${{ needs.version.outputs.version }}" `
                  /DSourceDir="$env:GITHUB_WORKSPACE\dist" `
                  /DOutputDir="$env:GITHUB_WORKSPACE\dist-installer" `
                  packaging\windows\OTTix.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            OTTix-*-win64.zip
            dist-installer/*.exe
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # elfutils provides eu-strip / eu-elfcompress, which flatpak-builder needs
      # to extract debug symbols: the flatpak-builder apt package does not pull
      # them in, and the build fails on the first compiled module.
      # librsvg2-common provides the gdk-pixbuf SVG loader, without which
      # "appstreamcli compose" cannot read the application icon and rejects the
      # component (file-read-error) at the export step.
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common

      - name: KDE runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11

      # Speeds up subsequent builds: downloaded sources (mpv, libplacebo,
      # libass...) and ccache objects.
      - name: Cache flatpak-builder
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}-
            flatpak-builder-

      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=flatpak-repo build-flatpak \
            packaging/flatpak/${APP_ID}.yml

      - name: Create the bundle
        run: |
          # --runtime-repo: installing the bundle then offers to add Flathub to
          # fetch org.kde.Platform//6.11 if it is missing.
          flatpak build-bundle flatpak-repo \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "OTTix-${{ needs.version.outputs.version }}-x86_64.flatpak" \
            "$APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: OTTix-*-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, windows, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List the artifacts
        run: find artifacts -type f -printf '%s\t%p\n'

      - uses: softprops/action-gh-release@v2
        with:
          name: OTTix ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.flatpak
