name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.11.2
  # aqtinstall 3.3.0 cannot install Qt 6.11 on Windows: the Qt repository changed
  # its layout for 6.11 (one subfolder per architecture,
  # qt6_6112/qt6_6112_mingw/) while aqt still looks for qt6_6112/qt6_6112/.
  # 6.10.3 is the latest installable version and still meets the project floor
  # (qt_standard_project_setup REQUIRES 6.10). Move back to 6.11 once aqtinstall
  # handles the new tree.
  QT_VERSION_WINDOWS: 6.10.3

jobs:
  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libmpv-dev libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libvulkan-dev libegl1-mesa-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      # AGENTS.md : qmllint doit rester a zero warning.
      - name: qmllint
        run: cmake --build build --target all_qmllint

      - name: Verify the installation
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Add MinGW and Ninja
        shell: pwsh
        run: |
          "$env:IQTA_TOOLS\mingw1310_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          choco install ninja -y --no-progress

      - name: Download libmpv
        shell: pwsh
        run: |
          & .github/scripts/fetch-libmpv.ps1 -Destination "$env:GITHUB_WORKSPACE\mpv"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DMPV_INCLUDE_DIR="$env:GITHUB_WORKSPACE/mpv/include" `
            -DMPV_LIBRARY="$env:GITHUB_WORKSPACE/mpv/libmpv.dll.a" `
            -DMPV_RUNTIME_DLL="$env:GITHUB_WORKSPACE/mpv/libmpv-2.dll"

      - name: Build
        run: cmake --build build
